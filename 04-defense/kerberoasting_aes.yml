title: Kerberoasting - demande de ticket de service en AES
id: a7f3c2d1-8b4e-4e21-9c6a-000000gryphon
status: experimental
description: >
  Detecte une demande de ticket de service Kerberos (TGS, event 4769) chiffree
  en AES vers un compte de service disposant d'un SPN. Complete la regle RC4
  classique, contournee lorsque le domaine force AES (Windows Server 2025).
author: Marc Bohoussou
date: 2026/11/06
references:
  - https://attack.mitre.org/techniques/T1558/003/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType:
      - '0x11'  # AES128
      - '0x12'  # AES256
  filter_machine:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: 'krbtgt'
  condition: selection and not filter_machine and not filter_krbtgt
falsepositives:
  - Demandes de tickets de service legitimes vers des comptes de service (volumineuses en production)
level: low
tags:
  - attack.credential_access
  - attack.t1558.003
